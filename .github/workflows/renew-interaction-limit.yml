name: Renew interaction limit

# Public-repo guardrail. Sets the interaction limit to `collaborators_only`
# every month so visitors can read but cannot open issues / comment / review.
# Backstop against prompt-injection from strangers reaching the agent loop.
# GitHub limits the maximum `expiry` to six_months; we re-apply it monthly
# so the limit never lapses.

on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  administration: write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Re-apply collaborators_only interaction limit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/interaction-limits" \
            -X PUT \
            -f limit=collaborators_only \
            -f expiry=six_months
