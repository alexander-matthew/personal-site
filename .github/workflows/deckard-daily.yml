name: Deckard's Diary — daily entry

# Writes one new diary entry per day (a short piece + its generative-art sketch),
# commits it to main, and lets the existing deploy workflow ship it.
#
# Deploy note: a push made with the default GITHUB_TOKEN does NOT trigger other
# workflows (GitHub's loop-prevention). So that the daily commit still deploys,
# add a fine-grained PAT with `contents:write` as the secret DECKARD_PUSH_TOKEN;
# pushes made with it trigger deploy.yml normally. Without it, the entry is still
# committed — it just deploys on the next push to main (or a manual run).

on:
  schedule:
    - cron: '12 9 * * *' # 09:12 UTC daily
  workflow_dispatch:
    inputs:
      date:
        description: 'Entry date YYYY-MM-DD (default: today UTC)'
        required: false
      offline:
        description: 'Force the offline backend (no API call)'
        type: boolean
        default: false

concurrency:
  group: deckard-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DECKARD_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Generate today's entry
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }} --force"; fi
          if [ "${{ github.event.inputs.offline }}" = "true" ]; then ARGS="$ARGS --offline"; fi
          uv run python scripts/deckard/generate_entry.py $ARGS

      - name: Commit and push
        run: |
          git config user.name  "deckard-diary[bot]"
          git config user.email "deckard-diary@users.noreply.github.com"
          git add app/content/deckard/entries app/static/js/deckard/sketches
          if git diff --cached --quiet; then
            echo "No new entry to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "diary: entry for ${DATE}"
          git push origin HEAD:main
