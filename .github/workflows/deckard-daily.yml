name: Deckard's Diary — daily entry

# Writes one new diary entry per day (a short piece + its generative-art sketch)
# and lands it on main through a pull request.
#
# Why a PR: main is a protected branch ("changes must be made through a pull
# request"), so a direct `git push origin HEAD:main` is rejected. The job opens a
# short-lived branch, pushes it, opens a PR, and merges it. With 0 required
# reviews and no required status checks, the bot's PR is immediately mergeable.
#
# Deploy note: a merge made with the default GITHUB_TOKEN does NOT trigger other
# workflows (GitHub's loop-prevention), so deploy.yml won't auto-run for the daily
# entry. To make each entry deploy on its own, add a fine-grained PAT with
# `contents:write` + `pull-requests:write` as the secret DECKARD_PUSH_TOKEN; it is
# used for the push and the merge, and merges made with it trigger deploy.yml.

on:
  schedule:
    - cron: '12 9 * * *' # 09:12 UTC daily
  workflow_dispatch:
    inputs:
      date:
        description: 'Entry date YYYY-MM-DD (default: today UTC)'
        required: false
      offline:
        description: 'Force the offline backend (no API call)'
        type: boolean
        default: false

concurrency:
  group: deckard-daily
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DECKARD_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Generate today's entry
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }} --force"; fi
          if [ "${{ github.event.inputs.offline }}" = "true" ]; then ARGS="$ARGS --offline"; fi
          uv run python scripts/deckard/generate_entry.py $ARGS

      - name: Commit entry via pull request
        env:
          GH_TOKEN: ${{ secrets.DECKARD_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "deckard-diary[bot]"
          git config user.email "deckard-diary@users.noreply.github.com"
          git add app/content/deckard/entries app/static/js/deckard/sketches
          if git diff --cached --quiet; then
            echo "No new entry to commit."
            exit 0
          fi
          ENTRY_DATE="${{ github.event.inputs.date }}"
          if [ -z "$ENTRY_DATE" ]; then ENTRY_DATE="$(date -u +%Y-%m-%d)"; fi
          BRANCH="diary/${ENTRY_DATE}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git commit -m "diary: entry for ${ENTRY_DATE}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "diary: entry for ${ENTRY_DATE}" \
            --body "Automated daily Deckard's Diary entry, generated by the deckard-daily workflow."
          # 0 required reviews + no required checks → immediately mergeable.
          gh pr merge "$BRANCH" --merge --delete-branch
