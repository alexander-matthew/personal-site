{% extends "palantir_base.html" %}

{% block title %}Server Error | {{ site.name }}{% endblock %}

{% block head %}
<style>
.error-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: calc(100vh - 64px);
    padding: var(--space-xl) var(--space-lg);
}

.error-page .eyebrow {
    margin-bottom: var(--space-sm);
}

.error-page .page-title {
    margin-bottom: var(--space-md);
}

.error-page-copy {
    font-family: var(--font-sans);
    font-size: var(--font-size-base);
    color: var(--text-secondary);
    max-width: 46ch;
    margin-bottom: var(--space-xl);
}
</style>
{% endblock %}

{% block main %}
<div class="error-page">
    <span class="eyebrow">Error</span>
    <h1 class="page-title">500</h1>
    <p class="error-page-copy">Something went wrong on our end. Please try again in a moment.</p>
    <a href="{{ url_for('main.home') }}" class="btn-pill">Go Home</a>
</div>
{% endblock %}
