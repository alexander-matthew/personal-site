{% extends "palantir_page.html" %}

{% block title %}Sudoku{% endblock %}
{% block page_title %}Sudoku{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/sudoku.css') }}">
<style>
.sudoku-container {
    padding: var(--space-sm);
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-md);
    padding-bottom: var(--space-sm);
    border-bottom: 1px solid var(--border-default);
}

.game-header h2 {
    font-size: var(--font-size-base);
    color: var(--text-primary);
    margin: 0;
}

.controls {
    display: flex;
    gap: var(--space-sm);
    align-items: center;
}

#difficulty {
    padding: var(--space-xs) var(--space-sm);
    background: var(--bg-primary);
    border: 1px solid var(--border-default);
    border-radius: 3px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: var(--font-size-sm);
}

.game-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-md);
}

.sudoku-grid {
    display: grid;
    grid-template-columns: repeat(9, 36px);
    grid-template-rows: repeat(9, 36px);
    gap: 1px;
    background: var(--border-bright);
    border: 2px solid var(--text-secondary);
    padding: 0;
    width: fit-content;
}

.cell {
    width: 36px;
    height: 36px;
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    font-family: var(--font-mono);
    color: var(--text-primary);
    transition: background var(--transition-fast);
}

.cell.given {
    background: var(--bg-surface);
    color: var(--text-secondary);
}

.cell.user-input {
    color: var(--accent);
}

.cell.selected {
    background: var(--accent-glow);
    box-shadow: inset 0 0 0 2px var(--accent);
}

.cell.error {
    background: rgba(248, 113, 113, 0.15);
    color: var(--color-error);
}

.cell.box-right {
    border-right: 2px solid var(--text-secondary);
}

.cell.box-bottom {
    border-bottom: 2px solid var(--text-secondary);
}

.number-buttons {
    display: flex;
    gap: var(--space-xs);
    flex-wrap: wrap;
    justify-content: center;
}

.num-btn {
    width: 36px;
    height: 36px;
    padding: 0;
    font-size: 14px;
    font-weight: bold;
    background: var(--bg-elevated);
    border: 1px solid var(--border-default);
    border-radius: 3px;
    color: var(--text-primary);
    cursor: pointer;
    font-family: var(--font-mono);
    transition: all var(--transition-fast);
}

.num-btn:hover {
    border-color: var(--accent);
    background: var(--accent-glow);
}

.num-btn:active {
    background: var(--accent);
    color: #000;
}

.num-btn.erase {
    width: auto;
    padding: 0 var(--space-sm);
    font-size: var(--font-size-sm);
}

.win-message {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    justify-content: center;
    align-items: center;
    z-index: 10000;
}

.win-message.show {
    display: flex;
}

.win-content {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: 4px;
    padding: var(--space-lg) var(--space-xl);
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}

.win-content h2 {
    font-size: var(--font-size-lg);
    color: var(--color-success);
    margin: 0 0 var(--space-sm) 0;
}

.win-content p {
    font-size: var(--font-size-sm);
    color: var(--text-secondary);
    margin: 0 0 var(--space-md) 0;
}

#play-again {
    padding: var(--space-sm) var(--space-md);
    background: var(--accent);
    border: none;
    border-radius: 3px;
    color: #000;
    font-family: var(--font-mono);
    font-size: var(--font-size-sm);
    font-weight: 600;
    cursor: pointer;
}

#play-again:hover {
    background: var(--accent-hover);
}

@media (max-width: 480px) {
    .sudoku-grid {
        grid-template-columns: repeat(9, 30px);
        grid-template-rows: repeat(9, 30px);
    }
    .cell { width: 30px; height: 30px; font-size: 14px; }
    .num-btn { width: 30px; height: 30px; font-size: 12px; }
}
</style>
{% endblock %}

{% block page_content %}
<div class="sudoku-container">
    <div class="game-header">
        <h2>Puzzle</h2>
        <div class="controls">
            <div class="difficulty-selector">
                <label for="difficulty" style="font-size: var(--font-size-sm); color: var(--text-secondary);">Difficulty:</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <button class="btn btn-primary" id="new-game">New Game</button>
        </div>
    </div>

    <div class="game-area">
        <div class="sudoku-grid" id="sudoku-grid"></div>

        <div class="number-buttons" id="number-buttons">
            <button class="num-btn" data-value="1">1</button>
            <button class="num-btn" data-value="2">2</button>
            <button class="num-btn" data-value="3">3</button>
            <button class="num-btn" data-value="4">4</button>
            <button class="num-btn" data-value="5">5</button>
            <button class="num-btn" data-value="6">6</button>
            <button class="num-btn" data-value="7">7</button>
            <button class="num-btn" data-value="8">8</button>
            <button class="num-btn" data-value="9">9</button>
            <button class="num-btn erase" data-value="0">Erase</button>
        </div>
    </div>

    <div class="win-message" id="win-message">
        <div class="win-content">
            <h2>Congratulations!</h2>
            <p>You solved the puzzle!</p>
            <button id="play-again">Play Again</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/sudoku-engine.js') }}"></script>
<script>
(function() {
    'use strict';

    let currentPuzzle = null;
    let currentSolution = null;
    let userGrid = null;
    let givenCells = null;
    let selectedCell = null;

    function init() {
        renderGrid();
        setupEventListeners();
        startNewGame();
    }

    function renderGrid() {
        const container = document.getElementById('sudoku-grid');
        container.textContent = '';

        for (let row = 0; row < 9; row++) {
            for (let col = 0; col < 9; col++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = row;
                cell.dataset.col = col;

                if (col % 3 === 2 && col !== 8) cell.classList.add('box-right');
                if (row % 3 === 2 && row !== 8) cell.classList.add('box-bottom');

                container.appendChild(cell);
            }
        }
    }

    function startNewGame() {
        const difficulty = document.getElementById('difficulty').value;
        const { puzzle, solution } = generatePuzzle(difficulty);

        currentPuzzle = puzzle;
        currentSolution = solution;
        userGrid = copyGrid(puzzle);
        givenCells = new Set();

        for (let row = 0; row < 9; row++) {
            for (let col = 0; col < 9; col++) {
                if (puzzle[row][col] !== 0) {
                    givenCells.add(`${row}-${col}`);
                }
            }
        }

        updateDisplay();
        document.getElementById('win-message').classList.remove('show');
        selectedCell = null;
    }

    function updateDisplay() {
        for (let row = 0; row < 9; row++) {
            for (let col = 0; col < 9; col++) {
                const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                const value = userGrid[row][col];

                cell.textContent = value === 0 ? '' : value;
                cell.classList.remove('given', 'user-input', 'selected', 'error');

                if (givenCells.has(`${row}-${col}`)) {
                    cell.classList.add('given');
                } else if (value !== 0) {
                    cell.classList.add('user-input');
                    if (!isValidPlacementForDisplay(row, col, value)) {
                        cell.classList.add('error');
                    }
                }

                if (selectedCell && selectedCell.row === row && selectedCell.col === col) {
                    cell.classList.add('selected');
                }
            }
        }
    }

    function isValidPlacementForDisplay(row, col, value) {
        const temp = userGrid[row][col];
        userGrid[row][col] = 0;
        const valid = isValidPlacement(userGrid, row, col, value);
        userGrid[row][col] = temp;
        return valid;
    }

    function setupEventListeners() {
        document.getElementById('sudoku-grid').addEventListener('click', (e) => {
            if (e.target.classList.contains('cell')) {
                selectCell(e.target);
            }
        });

        document.querySelectorAll('.num-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (selectedCell) {
                    enterNumber(parseInt(btn.dataset.value));
                }
            });
        });

        document.addEventListener('keydown', (e) => {
            if (!selectedCell) return;

            if (e.key >= '1' && e.key <= '9') {
                enterNumber(parseInt(e.key));
            } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
                enterNumber(0);
            } else if (e.key === 'ArrowUp') {
                moveSelection(-1, 0);
                e.preventDefault();
            } else if (e.key === 'ArrowDown') {
                moveSelection(1, 0);
                e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
                moveSelection(0, -1);
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                moveSelection(0, 1);
                e.preventDefault();
            }
        });

        document.getElementById('new-game').addEventListener('click', startNewGame);
        document.getElementById('play-again').addEventListener('click', startNewGame);
    }

    function selectCell(cell) {
        const row = parseInt(cell.dataset.row);
        const col = parseInt(cell.dataset.col);

        if (givenCells.has(`${row}-${col}`)) return;

        selectedCell = { row, col };
        updateDisplay();
    }

    function enterNumber(value) {
        if (!selectedCell) return;

        const { row, col } = selectedCell;
        if (givenCells.has(`${row}-${col}`)) return;

        userGrid[row][col] = value;
        updateDisplay();

        if (isComplete(userGrid)) {
            document.getElementById('win-message').classList.add('show');
        }
    }

    function moveSelection(rowDelta, colDelta) {
        if (!selectedCell) return;

        let newRow = selectedCell.row + rowDelta;
        let newCol = selectedCell.col + colDelta;

        if (newRow < 0) newRow = 8;
        if (newRow > 8) newRow = 0;
        if (newCol < 0) newCol = 8;
        if (newCol > 8) newCol = 0;

        const newCell = document.querySelector(`.cell[data-row="${newRow}"][data-col="${newCol}"]`);
        selectCell(newCell);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
{% endblock %}
