<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site.name }}{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/palantir.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Top Navigation -->
    <nav class="topnav">
        <a href="{{ url_for('main.home') }}" class="topnav-wordmark">{{ site.name }}</a>

        <div class="topnav-links">
            <a href="{{ url_for('main.about') }}" data-path="/about">About</a>
            <a href="{{ url_for('main.projects') }}" data-path="/projects">Projects</a>
            <a href="{{ url_for('blog.index') }}" data-path="/blog">Blog</a>
            <a href="{{ url_for('resume.index') }}" data-path="/resume">Resume</a>
            <a href="{{ url_for('news.index') }}" data-path="/news">News</a>
            <a href="{{ url_for('deckard.index') }}" data-path="/projects/deckard">Diary</a>
        </div>

        <div class="topnav-actions">
            <a href="{{ site.github_url }}" target="_blank" rel="noopener noreferrer" class="btn-pill">GitHub</a>
            <button class="hamburger" id="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-overlay">&#9776;</button>
        </div>
    </nav>

    <!-- Mobile full-screen overlay menu -->
    <div class="nav-overlay" id="nav-overlay">
        <div class="nav-overlay-header">
            <span class="topnav-wordmark">{{ site.name }}</span>
            <button class="nav-overlay-close" id="nav-overlay-close" aria-label="Close navigation">&times;</button>
        </div>

        <div class="nav-overlay-links">
            <a href="{{ url_for('main.about') }}" data-path="/about">About</a>
            <a href="{{ url_for('main.projects') }}" data-path="/projects">Projects</a>
            <a href="{{ url_for('blog.index') }}" data-path="/blog">Blog</a>
            <a href="{{ url_for('resume.index') }}" data-path="/resume">Resume</a>
            <a href="{{ url_for('news.index') }}" data-path="/news">News</a>
            <a href="{{ url_for('deckard.index') }}" data-path="/projects/deckard">Diary</a>
        </div>
    </div>

    <!-- Main Content -->
    <main>
        {% block main %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <span>&copy; 2026 Alexander</span>
        <span class="site-footer-links">
            <a href="{{ site.github_url }}" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </span>
    </footer>

    <script src="{{ url_for('static', filename='js/palantir.js') }}"></script>
    <script src="{{ url_for('static', filename='js/halftone.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
