<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Standalone page — no dependency on palantir.css, so the tokens
           needed for the Gravure look are re-declared locally (§8: every
           page must render acceptably even if shared assets are missing). */
        :root {
            --ink: #060709;
            --paper: #f2f6fb;
            --ice: #a9d2ff;
            --duotone-deep: #0d1b2e;
            --accent: #4da6ff;
            --accent-hover: #7fc0ff;
            --text-muted: #55606e;
            --font-display: 'Bodoni Moda', 'Times New Roman', serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            background: var(--ink);
            /* Subtle duotone glow so the page still reads as intentional
               even if halftone.js fails to load / the canvas stays blank. */
            background-image: radial-gradient(ellipse at 50% 35%, var(--duotone-deep) 0%, var(--ink) 65%);
            color: var(--paper);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .bg-halftone {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            /* The bayer field is texture, not subject — keep it quiet */
            opacity: 0.28;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 96px 48px;
            background: radial-gradient(ellipse 60% 55% at 50% 50%,
                rgba(6, 7, 9, 0.92) 0%, rgba(6, 7, 9, 0.65) 55%, transparent 100%);
        }

        .code {
            font-family: var(--font-display);
            font-weight: 500;
            font-size: clamp(96px, 26vw, 260px);
            line-height: 0.9;
            letter-spacing: -0.01em;
            color: var(--paper);
        }

        .caption {
            margin-top: 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary, #93a0b0);
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            margin-top: 32px;
            border-radius: 999px;
            padding: 10px 24px;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--paper);
            text-decoration: none;
            transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
        }

        .home-link:hover {
            background: transparent;
            color: var(--paper);
            border-color: var(--paper);
        }

        .home-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            .caption {
                font-size: 12px;
            }

            .home-link {
                margin-top: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <canvas class="bg-halftone" data-halftone="columns" data-style="bayer" data-cell="6" data-animate="false" aria-hidden="true"></canvas>

    <div class="content">
        <h1 class="code">404</h1>
        <p class="caption">This page does not exist.</p>
        <a href="{{ url_for('main.home') }}" class="home-link">Back home</a>
    </div>

    <script src="{{ url_for('static', filename='js/halftone.js') }}"></script>
</body>
</html>
